name = "yogamaya-ru"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "yogamaya-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_YOUR_KV_PREVIEW_NAMESPACE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "yogamaya-media"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "yogamaya_events"

[vars]
PUBLIC_SITE_NAME = "Yoga Maya"
PUBLIC_SITE_URL = "https://yogamaya.ru"
PUBLIC_WHATSAPP = "+79161234567"
PUBLIC_TELEGRAM = "@yogamaya_bot"
PUBLIC_PHONE = "+7 916 123-45-67"

# Telegram Login Widget bot of the sign-in page (/auth/login); set it to enable sign-in:
# PUBLIC_TELEGRAM_LOGIN_BOT_USERNAME = "yogamaya_bot"

# Secrets (set via wrangler secret put or Cloudflare dashboard):
# TELEGRAM_BOT_TOKEN
# NOTIFICATION_EMAIL
# AUTH_SECRET               — signs the session cookie
# TELEGRAM_LOGIN_BOT_TOKEN  — token of the login bot, checks the widget payload
# ADMIN_TELEGRAM_IDS        — comma-separated ids or @usernames with the admin role
# ADMIN_TELEGRAM_USERNAMES  — same, usernames only
# TEACHER_TELEGRAM_IDS      — ids or @usernames with the teacher role; others are students
